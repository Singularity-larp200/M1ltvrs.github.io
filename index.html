<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', monospace;
        }

        .custom-cursor {
            position: fixed;
            width: 40px;
            height: 40px;
            background: url('assets/custom_cursor.svg') no-repeat center center;
            background-size: contain;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
        }

        * {
            cursor: none !important;
        }

        *:focus,
        *:active,
        a:focus,
        a:active,
        button:focus,
        button:active {
            cursor: none !important;
        }

        input[type="range"],
        input[type="range"]::-webkit-slider-thumb,
        input[type="range"]::-moz-range-thumb {
            cursor: none !important;
        }

        *:focus {
            outline: none;
        }

        :root {
            --accent-color: #7c5cff;
            --panel-border: rgba(124, 92, 255, 0.5);
        }

        body {
            background-color: #05000a;
            color: #fff;
            overflow: hidden;
        }

        .container {
            width: 100%;
            height: 100vh;
            position: relative;
        }

        #background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            background-color: #05000a;
            background-image:
                linear-gradient(var(--accent-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--accent-color) 1px, transparent 1px);
            background-size: 48px 48px, 48px 48px;
            opacity: 0.25;
            animation: grid-drift 16s linear infinite;
        }

        @keyframes grid-drift {
            0% { background-position: 0 0, 0 0; }
            100% { background-position: 48px 48px, 48px 48px; }
        }

        .hidden {
            display: none !important;
        }
        .top-controls {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 20;
            background: #000000;
            padding: 8px 12px;
            border-radius: 20px;
        }

        .slider {
            -webkit-appearance: none;
            appearance: none;
            width: 80px;
            height: 5px;
            border-radius: 5px;
            background: #3a3a3a;
            outline: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
        }

        .transparency-control {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .transparency-icon {
            width: 20px;
            height: 20px;
            color: #ffffff;
        }

        #profile-block {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 820px;
            min-height: 332px;
            background: #0d0710;
            border: 1px solid var(--panel-border);
            padding: 20px;
            border-radius: 15px;
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 15px;
            pointer-events: auto;
        }

        .profile-header {
            display: flex;
            align-items: flex-start;
            gap: 15px;
        }

        .profile-container {
            position: relative;
            width: 150px;
            height: 150px;
        }
        .profile-container::after {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: var(--accent-color);
            animation: orbit 3s linear infinite;
            z-index: -1;
        }

        .profile-picture {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            cursor: pointer;
            pointer-events: auto;
        }

        .profile-info {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .name-and-badges {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        @font-face {
            font-family: 'Angel Wish';
            src: url('assets/Angel_wish.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        #profile-name {
            font-family: 'Angel Wish', sans-serif;
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 3px;
            color: #ffffff;
        }

        .badge-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .badge-container {
            position: relative;
            pointer-events: auto;
        }

        .badge-container .tooltip {
            visibility: hidden;
            width: 120px;
            background-color: #000000;
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 5px 0;
            position: absolute;
            z-index: 100;
            bottom: 125%;
            left: 50%;
            margin-left: -60px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .badge-container:hover .tooltip {
            visibility: visible;
            opacity: 1;
        }

        .badge-box {
            background: #1a1a1a;
            padding: 2px;
            border-radius: 15px;
            display: inline-block;
        }

        .badge-box-inner {
            background: #000000;
            padding: 5px;
            border-radius: 12px;
            display: flex;
            gap: 8px;
        }

        .badge {
            width: 22px;
            height: 22px;
            transition: transform 0.3s;
            pointer-events: auto;
        }

        .badge:hover {
            transform: scale(1.2);
        }

        #discord-activity {
            font-size: 16px;
            color: #a0a0a0;
            margin-top: 5px;
        }

        #profile-bio {
            color: #cccccc;
            font-size: 18px;
            line-height: 1.5;
            margin-bottom: 10px;
        }

        .bio-separator {
            width: 100%;
            height: 1px;
            background: #2a2a2a;
            margin: 20px 0;
        }

        .profile-footer {
            display: flex;
            flex-direction: column;
            gap: 5px;
            width: 100%;
            margin-top: auto;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 0;
            pointer-events: auto;
        }

        .social-icon {
            width: 36px;
            height: 36px;
            transition: transform 0.3s ease;
            pointer-events: auto;
        }

        .social-icon:hover {
            transform: scale(1.4);
        }

        #skills-block {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 820px;
            min-height: 332px;
            background: #0d0710;
            border: 1px solid var(--panel-border);
            padding: 20px;
            border-radius: 15px;
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .skills-title {
            text-align: center;
            font-size: 24px;
            margin-bottom: 15px;
        }

        .skill {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .skill-name {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .skill-icon {
            width: 22px;
            height: 22px;
            margin-right: 8px;
        }

        .skill-bar-container {
            height: 10px;
            background: #1a1a1a;
            border-radius: 5px;
            overflow: hidden;
        }

        .skill-bar {
            height: 100%;
            border-radius: 5px;
            width: 0%;
            transition: width 2s;
        }
        #python-bar {
            background: #ff6b6b;
        }

        #html-bar {
            background: #4facfe;
        }

        #golang-bar {
            background: #43e97b;
        }

        #results-button-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
        }

        #results-theme {
            background: #000000;
            color: #ffffff;
            border: 1px solid #3a3a3a;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            transition: background 0.3s;
        }

        #results-theme:hover {
            background: #1a1a1a;
        }

        #results-hint {
            position: absolute;
            background: #000000;
            color: white;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 12px;
            width: 180px;
            text-align: center;
            pointer-events: none;
            z-index: 25;
            border: 1px solid #2a2a2a;
        }

        #results-hint::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 0 10px 10px 10px;
            border-style: solid;
            border-color: transparent transparent #000000 transparent;
        }

        @keyframes orbit {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .cursor-trail {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
        }

        .cursor-trail-dot {
            position: absolute;
            width: 6px;
            height: 6px;
            background-color: #ffffff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: opacity 0.3s ease;
        }

        #start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 30;
            cursor: pointer;
        }

        #start-text {
            font-family: 'Courier New', monospace;
            font-size: 24px;
            color: #fff;
            text-align: center;
        }

        @media (max-width: 430px) {
            #profile-block, #skills-block {
                width: 90vw;
                max-width: 350px;
                min-height: 280px;
                padding: 15px;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
            }

            .profile-header {
                flex-direction: column;
                align-items: center;
                gap: 10px;
            }

            .profile-container {
                width: 120px;
                height: 120px;
            }

            .profile-picture {
                width: 120px;
                height: 120px;
            }

            .profile-info {
                align-items: center;
                text-align: center;
            }

            .name-and-badges {
                flex-direction: column;
                align-items: center;
                gap: 8px;
            }

            #profile-name {
                font-size: 24px;
                letter-spacing: 2px;
            }

            .badge-group {
                justify-content: center;
                gap: 6px;
            }

            .badge {
                width: 18px;
                height: 18px;
            }

            .badge-container .tooltip {
                width: 100px;
                font-size: 12px;
                margin-left: -50px;
                bottom: 110%;
            }

            #profile-bio {
                font-size: 14px;
                line-height: 1.4;
            }

            .bio-separator {
                margin: 15px 0;
            }

            .social-links {
                gap: 10px;
                justify-content: center;
            }

            .social-icon {
                width: 32px;
                height: 32px;
            }

            .skills-title {
                font-size: 18px;
                margin-bottom: 10px;
            }

            .skill-icon {
                width: 18px;
                height: 18px;
            }

            .skill-name span {
                font-size: 14px;
            }

            .top-controls {
                bottom: 20px;
                gap: 10px;
                padding: 6px 10px;
            }

            .transparency-control {
                gap: 6px;
            }

            .transparency-icon {
                width: 18px;
                height: 18px;
            }

            .slider {
                width: 60px;
                height: 4px;
            }

            .slider::-webkit-slider-thumb {
                width: 10px;
                height: 10px;
            }

            #results-button-container {
                top: 10px;
            }

            #results-theme {
                padding: 6px 12px;
                font-size: 12px;
            }

            #results-hint {
                width: 150px;
                font-size: 10px;
                padding: 6px 10px;
            }

            #start-text {
                font-size: 18px;
                padding: 0 20px;
            }
        }
    </style>
</head>
<body onload="initMedia()">

    <div class="custom-cursor"></div>

    <div id="start-screen">
        <div id="start-text"></div>
    </div>

    <div class="container">

        <div id="background"></div>

        <div id="profile-block">
            <div class="profile-header">
                <div class="profile-container">
                    <img src="assets/profile.svg" alt="Profile" class="profile-picture">
                </div>
                <div class="profile-info">
                    <div class="name-and-badges">
                        <div id="profile-name">Singularity</div>

                        <div class="badge-box">
                            <div class="badge-box-inner">
                                <div class="badge-group">
                                    <div class="badge-container">
                                        <img src="assets/staff.svg" alt="Staff" class="badge">
                                        <span class="tooltip">Staff Member</span>
                                    </div>
                                    <div class="badge-container">
                                        <img src="assets/owner.svg" alt="Owner" class="badge">
                                        <span class="tooltip">Owner</span>
                                    </div>
                                    <div class="badge-container">
                                        <img src="assets/partner.svg" alt="Partner" class="badge">
                                        <span class="tooltip">Partner</span>
                                    </div>
                                    <div class="badge-container">
                                        <img src="assets/developer.svg" alt="Developer" class="badge">
                                        <span class="tooltip">Developer</span>
                                    </div>
                                    <div class="badge-container">
                                        <img src="assets/bug_bounty.svg" alt="Bug Bounty" class="badge">
                                        <span class="tooltip">Bug Bounty</span>
                                    </div>
                                    <div class="badge-container">
                                        <img src="assets/og.svg" alt="OG" class="badge">
                                        <span class="tooltip">OG</span>
                                    </div>
                                    <div class="badge-container">
                                        <img src="assets/founder.svg" alt="Founder" class="badge">
                                        <span class="tooltip">Founder</span>
                                    </div>
                                    <div class="badge-container">
                                        <img src="assets/verified.svg" alt="Verified" class="badge">
                                        <span class="tooltip">Verified</span>
                                    </div>
                                    <div class="badge-container">
                                        <img src="assets/rule_maker.svg" alt="Rule Maker" class="badge">
                                        <span class="tooltip">Rule Maker</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div id="discord-activity">Loading Discord status…</div>
                    <div id="profile-bio"></div>
                </div>
            </div>

            <div class="bio-separator"></div>

            <div class="profile-footer">
                <div class="social-links">
                    <a href="https://github.com/Ascend-Home?tab=repositories" target="_blank">
                        <img src="assets/github.svg" alt="GitHub" class="social-icon">
                    </a>

                    <a href="https://youtu.be/dQw4w9WgXcQ?si=2wJKBBSqlk6OwzGC" target="_blank">
                        <img src="assets/soundcloud.svg" alt="SoundCloud" class="social-icon">
                    </a>

                    <a href="https://guns.lol/s7ngularity" target="_blank">
                        <img src="assets/namemc.svg" alt="NameMC" class="social-icon">
                    </a>
                </div>
            </div>
        </div>

        <div id="skills-block" class="hidden">
            <h2 class="skills-title">Programming Skills</h2>
            <div class="skill">
                <div class="skill-name">
                    <img src="assets/python.svg" alt="Python" class="skill-icon">
                    <span>Python</span>
                    <span>80%</span>
                </div>
                <div class="skill-bar-container">
                    <div id="python-bar" class="skill-bar"></div>
                </div>
            </div>
            <div class="skill">
                <div class="skill-name">
                    <img src="assets/html.svg" alt="HTML" class="skill-icon">
                    <span>html</span>
                    <span>100%</span>
                </div>
                <div class="skill-bar-container">
                    <div id="html-bar" class="skill-bar"></div>
                </div>
            </div>
            <div class="skill">
                <div class="skill-name">
                    <img src="assets/golang.svg" alt="Go" class="skill-icon">
                    <span>Go</span>
                    <span>30%</span>
                </div>
                <div class="skill-bar-container">
                    <div id="golang-bar" class="skill-bar"></div>
                </div>
            </div>
        </div>

        <div id="results-button-container" class="hidden">
            <button id="results-theme">View Results</button>
            <div id="results-hint" class="hidden">Click again to return to profile</div>
        </div>

        <div class="top-controls">
            <div class="transparency-control">
                <svg class="transparency-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                </svg>
                <input id="transparency-slider" class="slider" type="range" min="0" max="1" step="0.01" value="0.7">
            </div>
        </div>
    </div>

    <audio id="background-music" loop>
        <source src="background.mp3" type="audio/mp3">
    </audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="script.js"></script>

</body>
</html>
